function notice(text){const t=$('toast');t.textContent=text;t.classList.remove('hidden');setTimeout(()=>t.classList.add('hidden'),4400)}
function header(){return `<div class="head"><div><div class="eyebrow">YUNO / CONTROL CENTER</div><h1>${esc(NAV[page])}</h1><p>ניהול פעילות העסק ממסד נתונים משותף.</p></div><div class="row">${['overview','finance'].includes(page)?`<select id="period" class="field" style="width:auto"><option value="7">7 ימים</option><option value="30">30 ימים</option><option value="90">90 ימים</option><option value="all">כל הזמנים</option></select>`:''}${KINDS[page]?`<button class="btn" onclick="openForm('${page}')">+ הוספה חדשה</button>`:page==='overview'?'<button class="btn" onclick="openForm(\'outreach\')">+ פנייה חדשה</button>':''}</div></div>`}
function metric(icon,name,value,hint){return `<div class="card metric"><div class="icon">${icon}</div><div class="value" dir="auto">${esc(value)}</div><div class="name">${esc(name)}</div><div class="hint">${esc(hint)}</div></div>`}
function statistics(){const a=items('outreach').filter(x=>dateOk(x.date,period)),p=items('posts').filter(x=>x.status==='פורסם'&&dateOk(x.date,period)),c=items('clients').filter(x=>dateOk(x.date,period)),e=items('expenses').filter(x=>dateOk(x.date,period)),inc=items('income').filter(x=>dateOk(x.date,period));const st=['טרם נשלחה','נשלחה','נצפתה','התקבלה תגובה','מתעניין','הצעה נשלחה','נסגרה עסקה'];const count=i=>a.filter(x=>st.indexOf(x.status)>=i).length;const sum=k=>p.reduce((n,x)=>n+val(x[k]),0);const income=inc.reduce((n,x)=>n+val(x.amount),0),expenses=e.reduce((n,x)=>n+val(x.amount),0);return {sent:count(1),viewed:count(2),replied:count(3),qualified:count(4),closed:a.filter(x=>x.status==='נסגרה עסקה').length,posts:p.length,impressions:sum('impressions'),reach:sum('reach'),clicks:sum('clicks'),engagement:sum('likes')+sum('comments')+sum('shares'),postLeads:sum('leads'),dealValue:c.filter(x=>['פעיל','הושלם'].includes(x.status)).reduce((n,x)=>n+val(x.value),0),income,expenses,balance:income-expenses}}
function chart(){const points=[],size=period==='7'?7:10,step=period==='7'?1:period==='90'?9:period==='all'?30:3;for(let i=size-1;i>=0;i--){const end=new Date();end.setHours(23,59,59,999);end.setDate(end.getDate()-i*step);const start=new Date(end);start.setDate(start.getDate()-step+1);start.setHours(0,0,0,0);const n=items('outreach').filter(x=>{const d=new Date(x.date+'T12:00:00');return d>=start&&d<=end}).length;points.push({n,label:(end.getMonth()+1)+'/'+end.getDate()})}const max=Math.max(1,...points.map(x=>x.n));return `<div class="chart">${points.map(x=>`<div class="barcol"><div class="bar" title="${x.n} פניות" style="height:${Math.max(2,Math.round(x.n/max*135))}px"></div><small>${x.label}</small></div>`).join('')}</div><p class="muted">פניות לפי תאריך שהוזן</p>`}
function overview(){const s=statistics(),steps=[['נשלחו',s.sent],['נצפו',s.viewed],['הגיבו',s.replied],['מתעניינים',s.qualified],['נסגרו',s.closed]];return `<div class="hero"><div><div class="eyebrow">THE BIG PICTURE</div><h2>לראות את הדרך.<br>למדוד את ההתקדמות.</h2><p>מפנייה ראשונה ועד לקוח משלם, כל הנתונים במקום אחד.</p></div><div class="mark">Y.</div></div><div class="grid">${metric('↗','פניות שנשלחו',fmt(s.sent),'בתקופה הנבחרת')}${metric('◉','פניות שנצפו',fmt(s.viewed),pct(s.viewed,s.sent)+' מתוך שנשלחו')}${metric('✉','תגובות שהתקבלו',fmt(s.replied),pct(s.replied,s.sent)+' מתוך שנשלחו')}${metric('♙','לקוחות פעילים',fmt(items('clients').filter(x=>x.status==='פעיל').length),'בכל הזמנים')}</div><div class="two"><div class="card"><h3>מגמת פניות</h3>${chart()}</div><div class="card"><h3>משפך פניות</h3><div class="funnel">${steps.map(([n,v])=>`<div class="frow"><span>${n}</span><div class="track"><div class="fill" style="width:${s.sent?100*v/s.sent:0}%"></div></div><b>${fmt(v)}</b></div>`).join('')}</div><p class="muted">שיעור סגירה: ${pct(s.closed,s.sent)}</p></div></div><div class="grid">${metric('▣','פוסטים שפורסמו',fmt(s.posts),'בתקופה הנבחרת')}${metric('◎','חשיפות',fmt(s.impressions),'סך הופעות הפוסטים')}${metric('◉','Reach מדווח',fmt(s.reach),'סכום Reach בין פוסטים')}${metric('↗','קליקים',fmt(s.clicks),pct(s.clicks,s.impressions)+' מכלל החשיפות')}</div><div class="two"><div class="card"><h3>פניות אחרונות</h3>${items('outreach').slice(0,5).map(x=>`<p>${esc(x.name)} · <span class="badge">${esc(x.status||'—')}</span></p>`).join('')||'<p class="muted">אין עדיין פניות.</p>'}</div><div class="card"><h3>תמונת העסק</h3><p>הכנסות שנרשמו: <b class="income-value">${money(s.income)}</b></p><p>הוצאות שנרשמו: <b class="expense-value">${money(s.expenses)}</b></p><p>יתרה: <b class="${s.balance>=0?'income-value':'expense-value'}">${money(s.balance)}</b></p><p class="muted">יתרה ניהולית בלבד; אינה רווח חשבונאי. שווי עסקאות נפרד: ${money(s.dealValue)}.</p></div></div>`}
function badge(v){return `<span class="badge ${['פעיל','פורסם','נסגרה עסקה','הושלמה'].includes(v)?'ok':''}">${esc(v||'—')}</span>`}
function displayValue(k,v){if(k==='status')return badge(v);if(k==='amount')return `<strong class="${currentTableKind==='income'?'income-value':'expense-value'}">${currentTableKind==='income'?'+':'−'}${money(v)}</strong>`;if(k==='value')return money(v);if(['impressions','reach','clicks'].includes(k))return fmt(v);return esc(v||'—')}
let currentTableKind='';function table(kind){currentTableKind=kind;const cols=COLS[kind],fields=FIELDS[kind],rows=items(kind).filter(x=>JSON.stringify(x).toLowerCase().includes(query.toLowerCase()));return `<div class="card"><div class="tablehead"><div><h3>${esc(KINDS[kind])}</h3><span class="muted">${rows.length} רשומות</span></div><div class="row"><input id="search" class="field" style="width:170px" placeholder="חיפוש..." value="${esc(query)}"><button class="ghost" onclick="exportCSV('${kind}')">ייצוא CSV</button></div></div><div class="tablewrap"><table><thead><tr>${cols.map(k=>`<th>${esc(fields.find(f=>f[0]===k)?.[1]||k)}</th>`).join('')}<th>פעולות</th></tr></thead><tbody>${rows.map(x=>`<tr>${cols.map(k=>`<td>${displayValue(k,x[k])}</td>`).join('')}<td>${!x.owner_id||x.owner_id===currentUser?.id?`<button class="mini" onclick="openForm('${kind}',${esc(JSON.stringify(x.id))})">עריכה</button> <button class="mini danger" onclick="deleteItem(${esc(JSON.stringify(x.id))})">מחיקה</button>`:'<span class="muted">רשומה של משתמש אחר</span>'}</td></tr>`).join('')||`<tr><td colspan="${cols.length+1}" class="empty">אין רשומות. לחצו על הוספה חדשה.</td></tr>`}</tbody></table></div></div>`}
function section(kind){const s=statistics(),cards={outreach:[['נשלחו',s.sent],['נצפו',s.viewed],['הגיבו',s.replied],['נסגרו',s.closed]],clients:[['לקוחות',items('clients').length],['פעילים',items('clients').filter(x=>x.status==='פעיל').length],['פוטנציאליים',items('clients').filter(x=>x.status==='פוטנציאלי').length],['שווי עסקאות',money(s.dealValue)]],posts:[['פורסמו',items('posts').filter(x=>x.status==='פורסם').length],['חשיפות',s.impressions],['מעורבות',s.engagement],['לידים מתוכן',s.postLeads]],expenses:[['הוצאות',money(s.expenses)],['הכנסות',money(s.income)],['יתרה',money(s.balance)],['רשומות',items('expenses').length]],income:[['הכנסות',money(s.income)],['הוצאות',money(s.expenses)],['יתרה',money(s.balance)],['רשומות',items('income').length]],tasks:[['משימות',items('tasks').length],['בתהליך',items('tasks').filter(x=>x.status==='בתהליך').length],['באיחור',items('tasks').filter(x=>x.status!=='הושלמה'&&x.due&&x.due<today()).length],['הושלמו',items('tasks').filter(x=>x.status==='הושלמה').length]]};const note=kind==='expenses'||kind==='income'?'הכנסות הן תקבולים שנרשמו ידנית; שווי עסקה אינו נכלל בהן אוטומטית. היתרה אינה רווח חשבונאי.':kind==='posts'?'Reach בין פוסטים עלול לספור אותו אדם יותר מפעם אחת.':'';return `<div class="grid">${cards[kind].map(([a,b])=>metric('◈',a,typeof b==='number'?fmt(b):b,'לפי נתונים שהוזנו')).join('')}</div>${note?`<div class="notice">${note}</div>`:''}${table(kind)}`}
function finance(){const s=statistics(),rows=[...items('income').filter(x=>dateOk(x.date,period)).map(x=>({...x,flow:'income'})),...items('expenses').filter(x=>dateOk(x.date,period)).map(x=>({...x,flow:'expenses'}))].sort((a,b)=>String(b.date||'').localeCompare(String(a.date||'')));return `<div class="grid">${metric('↗','הכנסות',money(s.income),'בתקופה הנבחרת')}${metric('↘','הוצאות',money(s.expenses),'בתקופה הנבחרת')}${metric('◈','יתרה',money(s.balance),'הכנסות פחות הוצאות')}${metric('▣','תנועות',fmt(rows.length),'בתקופה הנבחרת')}</div><div class="card"><div class="tablehead"><h3>טבלת הכנסות והוצאות</h3><div class="row"><button class="btn" onclick="openForm('income')">+ הכנסה</button><button class="ghost" onclick="openForm('expenses')">+ הוצאה</button></div></div><div class="tablewrap"><table class="finance-table"><thead><tr><th>תאריך</th><th>סוג</th><th>תיאור</th><th>קטגוריה</th><th>סכום</th><th>פעולות</th></tr></thead><tbody>${rows.map(x=>`<tr class="${x.flow==='income'?'income-row':'expense-row'}"><td>${esc(x.date||'—')}</td><td>${x.flow==='income'?'הכנסה':'הוצאה'}</td><td>${esc(x.title||'—')}</td><td>${esc(x.category||'—')}</td><td class="${x.flow==='income'?'income-value':'expense-value'}">${x.flow==='income'?'+':'−'}${money(x.amount)}</td><td>${!x.owner_id||x.owner_id===currentUser?.id?`<button class="mini" onclick="openForm('${x.flow}',${esc(JSON.stringify(x.id))})">עריכה</button> <button class="mini danger" onclick="deleteItem(${esc(JSON.stringify(x.id))})">מחיקה</button>`:'<span class="muted">רשומה של משתמש אחר</span>'}</td></tr>`).join('')||'<tr><td colspan="6" class="empty">עדיין אין תנועות.</td></tr>'}</tbody></table></div></div><p class="muted">היתרה היא סכום ניהולי לפי תאריכי התנועות, לא דוח רווח והפסד.</p>`}
function startChat(id){if(!profiles.some(p=>p.user_id===id&&id!==currentUser?.id))return;recipientId=id;page='messages';render()}
function setMode(next){if(!['dark','light'].includes(next))return;mode=next;try{localStorage.setItem('yuno-mode',next)}catch{}render()}
function setTheme(next){if(!['black','purple','pink'].includes(next))return;theme=next;try{localStorage.setItem('yuno-theme',next)}catch{}render()}
function usersView(){return `<div class="two"><div class="card"><h3>החשבון שלי</h3><p>מחובר כ־<b>${esc(displayName)}</b></p><p class="muted">מזהה חשבון למינוי מנהל: <code dir="ltr">${esc(currentUser?.id||'')}</code></p><form id="renameForm"><label>שינוי שם תצוגה<input class="field" name="name" minlength="2" maxlength="40" required value="${esc(displayName)}"></label><button class="btn" style="margin-top:10px">שמור שם</button></form><form id="phoneForm" style="margin-top:16px"><label>הטלפון שלי (פרטי לחשבון)<input class="field" type="tel" name="phone" maxlength="30" value="${esc(phone)}"></label><button class="ghost" style="margin-top:10px">שמור טלפון</button></form><form id="pinForm" style="margin-top:16px"><label>קוד נוכחי<input class="field" type="password" name="old" inputmode="numeric" pattern="[0-9]{3}" maxlength="3" required></label><label>קוד חדש<input class="field" type="password" name="next" inputmode="numeric" pattern="[0-9]{3}" maxlength="3" required></label><button class="ghost" style="margin-top:10px">שנה קוד</button></form><div class="row" style="margin-top:18px"><button class="ghost" onclick="exportTXT()">הורדת כל הנתונים ל־TXT</button><button class="ghost" onclick="logoutAccount()">יציאה</button>${isAdmin?'<button class="ghost danger" onclick="wipeAll()">מחיקת כל נתוני האתר</button>':''}</div><p class="muted">שם משתמש אינו הרשאת מנהל. קוד בן 3 ספרות אינו מתאים למידע רגיש.</p></div><div class="card"><h3>משתמשים (${profiles.length})</h3>${profiles.map(x=>{const recent=Date.now()-new Date(x.last_seen_at).getTime()<90000;return `<div class="user-line"><span>${esc(x.display_name)} ${x.user_id===currentUser?.id?'(אני)':''}</span><span class="${recent?'income-value':'muted'}">${recent?'● פעיל לאחרונה':'○ לא פעיל'} ${x.user_id!==currentUser?.id?`<button type="button" class="mini" onclick="startChat('${esc(x.user_id)}')">הודעה</button>`:''}</span></div>`}).join('')||'<p class="muted">אין משתמשים להצגה.</p>'}<p class="muted">פעיל לאחרונה הוא אומדן לפי עדכון מהדפדפן.</p></div></div>`}
function messagesView(){const choices=profiles.filter(p=>p.user_id!==currentUser?.id);if(recipientId&&!choices.some(p=>p.user_id===recipientId))recipientId='';const oldOwn=messages.filter(m=>!m.recipient_id&&m.author_id===currentUser?.id);const conversation=messages.filter(m=>recipientId&&((m.author_id===currentUser?.id&&m.recipient_id===recipientId)||(m.author_id===recipientId&&m.recipient_id===currentUser?.id)));return `<div class="card"><div class="tablehead"><h3>הודעות פרטיות</h3><span class="muted">${conversation.length} הודעות בשיחה</span></div><label>בחרו נמען<select class="field" id="recipientSelect"><option value="">בחרו משתמש...</option>${choices.map(p=>`<option value="${esc(p.user_id)}" ${recipientId===p.user_id?'selected':''}>${esc(p.display_name)}</option>`).join('')}</select></label><div class="chat-list" style="margin-top:15px">${recipientId?conversation.map(m=>`<div class="chat-item ${m.author_id===currentUser?.id?'mine':''}"><div class="chat-meta">${esc(profiles.find(p=>p.user_id===m.author_id)?.display_name||'משתמש אנונימי')} · ${esc(new Date(m.created_at).toLocaleString('he-IL'))}${m.author_id===currentUser?.id?` <button type="button" class="mini danger" onclick="deleteMessage('${esc(m.id)}')">מחיקה</button>`:''}</div><div class="chat-text">${esc(m.body)}</div></div>`).join('')||'<p class="muted">אין הודעות בשיחה הזו.</p>':'<p class="muted">בחרו משתמש מהרשימה כדי להתחיל שיחה.</p>'}</div>${recipientId?'<form id="messageForm" style="margin-top:16px;display:flex;gap:9px;align-items:end"><label style="flex:1">הודעה<textarea name="body" rows="2" maxlength="1000" required placeholder="כתבו הודעה..."></textarea></label><button class="btn">שלח</button></form>':''}${oldOwn.length?`<details style="margin-top:16px"><summary>הודעות ישנות ששלחתי (${oldOwn.length})</summary><p class="muted">הודעות אלה היו משותפות בעבר; כעת רק אתה יכול לראות ולמחוק אותן.</p>${oldOwn.map(m=>`<div class="chat-item"><div class="chat-text">${esc(m.body)}</div><button type="button" class="mini danger" onclick="deleteMessage('${esc(m.id)}')">מחיקה</button></div>`).join('')}</details>`:''}<p class="muted">שיחות חדשות מוגבלות במסד לשולח ולנמען. שם תצוגה אינו אימות זהות; בעלי גישה ניהולית למסד עשויים לגשת לנתונים.</p></div>`}
function about(){return `<div class="two"><div class="card"><h3>חיבור ל־Supabase</h3><p class="muted">הרשומות נקראות ונשמרות במסד הנתונים המשותף. אין אימייל או שרת Next.js; כניסה לפי שם וקוד בן 3 ספרות.</p><p>מצב: ${esc(status)}</p><button class="ghost" onclick="loadRemote()">רענון נתונים</button></div><div class="card"><h3>אזהרת פרטיות</h3><p class="muted">זוהי גרסת בדיקה ציבורית. שמות תצוגה אינם הרשאת מנהל; רשומות עסקיות משותפות למשתמשים שנכנסו, בעוד הודעות פרטיות מוגבלות במסד לשולח ולנמען. אל תזינו מידע רגיש.</p></div></div>`}
function render(){document.body.dataset.theme=theme;document.body.dataset.mode=mode;const root=$('root');if(!connected){root.innerHTML=`<div class="overlay"><div class="dialog"><div class="brand">YUNO <b>AI</b></div><h2>חיבור למסד הנתונים</h2><p class="muted">${esc(lastError||'מתחברים אוטומטית, ללא אימייל...')}</p>${lastError?'<button class="btn" onclick="connect()">נסה שוב</button>':''}</div></div>`;return}if(!displayName){root.innerHTML=`<div class="overlay"><div class="dialog"><div class="brand">YUNO <b>AI</b></div><h2>כניסה לחשבון</h2><p class="muted">בכל כניסה מזינים שם וקוד אישי בן 3 ספרות. ניתן להיכנס מאותו חשבון גם ממכשיר אחר.</p><form id="loginForm"><div class="formgrid"><label>שם משתמש<input class="field" name="name" minlength="2" maxlength="40" required autocomplete="username"></label><label>קוד אישי (3 ספרות)<input class="field" name="pin" type="password" inputmode="numeric" pattern="[0-9]{3}" maxlength="3" required autocomplete="off"></label></div><button class="btn" style="margin-top:12px">כניסה</button></form><hr style="border:0;border-top:1px solid var(--line);margin:20px 0"><h3>משתמש חדש / שדרוג חשבון ישן</h3><form id="registerForm"><div class="formgrid"><label>שם משתמש<input class="field" name="name" minlength="2" maxlength="40" required></label><label>קוד חדש בן 3 ספרות<input class="field" name="pin" type="password" inputmode="numeric" pattern="[0-9]{3}" maxlength="3" required autocomplete="off"></label><label class="wide">טלפון אישי (אופציונלי)<input class="field" name="phone" type="tel" maxlength="30" autocomplete="tel"></label></div><button class="ghost" style="margin-top:12px">יצירת חשבון</button></form><p class="muted">קוד בן 3 ספרות חלש מאוד. אין להזין מידע רגיש. אם כבר השתמשתם בגרסה הישנה, צרו חשבון באותו דפדפן כדי לשייך את הנתונים שלכם.</p></div></div>`;$('loginForm').onsubmit=loginAccount;$('registerForm').onsubmit=registerAccount;return}root.innerHTML=`<div class="app"><aside id="side" class="side"><div class="brand">YUNO <b>AI</b><small>DASHBOARD</small></div><div class="mode">● ${esc(displayName)} · ענן משותף</div><div class="theme-picker">${[['black','שחור'],['purple','סגול'],['pink','ורוד']].map(([key,label])=>`<button type="button" data-theme-choice="${key}" class="${theme===key?'selected':''}">${label}</button>`).join('')}</div><div class="mode-picker"><button type="button" data-mode-choice="dark" class="${mode==='dark'?'selected':''}">☾ כהה</button><button type="button" data-mode-choice="light" class="${mode==='light'?'selected':''}">☀ בהיר</button></div><nav>${Object.entries(NAV).map(([k,n])=>`<button class="nav ${k===page?'on':''}" data-page="${k}">${esc(n)}</button>`).join('')}</nav><div class="sidefoot">קוד בן 3 ספרות אינו מתאים למידע רגיש.</div></aside><main class="main"><div class="top"><div class="row"><button class="mini menu" id="menu">☰</button> YUNO AI / ${esc(NAV[page])}</div><div id="sync" class="status ${status==='שגיאת סנכרון'?'bad':''}">${esc(status)}</div></div><div class="content"><div class="notice">נתונים עסקיים משותפים. טלפון אישי והודעות פרטיות מוגבלים בהרשאות המסד; קוד בן 3 ספרות אינו הגנה מספקת למידע רגיש.</div>${header()}${page==='overview'?overview():KINDS[page]?section(page):page==='finance'?finance():page==='users'?usersView():page==='messages'?messagesView():about()}</div></main></div><div id="modal" class="overlay hidden"></div>`;document.querySelectorAll('[data-page]').forEach(b=>b.onclick=()=>{page=b.dataset.page;query='';render()});$('menu').onclick=()=>$('side').classList.toggle('open');document.querySelectorAll('[data-theme-choice]').forEach(b=>b.onclick=()=>setTheme(b.dataset.themeChoice));document.querySelectorAll('[data-mode-choice]').forEach(b=>b.onclick=()=>setMode(b.dataset.modeChoice));if($('period')){$('period').value=period;$('period').onchange=e=>{period=e.target.value;render()}}if($('search'))$('search').oninput=e=>{query=e.target.value;const pos=e.target.selectionStart;render();const x=$('search');x.focus();x.setSelectionRange(pos,pos)};if($('renameForm'))$('renameForm').onsubmit=saveName;if($('phoneForm'))$('phoneForm').onsubmit=savePhone;if($('pinForm'))$('pinForm').onsubmit=changePin;if($('messageForm'))$('messageForm').onsubmit=sendMessage;if($('recipientSelect'))$('recipientSelect').onchange=e=>{recipientId=e.target.value;render()}}
let connecting=false;
async function connect(){if(connecting)return;connecting=true;lastError='';render();try{if(!window.supabase?.createClient)throw Error('ספריית Supabase לא נטענה.');db=db||window.supabase.createClient(SUPABASE_URL,SUPABASE_PUBLISHABLE_KEY,{auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:false}});let {data:{user},error:userError}=await db.auth.getUser();if(userError)user=null;if(user&&!user.is_anonymous){await db.auth.signOut();user=null}if(!user){const r=await db.auth.signInAnonymously();if(r.error||!r.data.user)throw Error('יש להפעיל Anonymous Sign-Ins: '+(r.error?.message||''));user=r.data.user}currentUser=null;displayName='';connected=true;status='ממתין לכניסה';const out=await db.rpc('yuno_logout');if(out.error)throw Error('הריצו תחילה setup-account-upgrade.sql: '+out.error.message);render()}catch(e){connected=false;lastError=e.message;render()}finally{connecting=false}}
async function finishAccount(accountId){currentUser={id:accountId};displayName='';const r=await db.from('yuno_profiles').select('display_name').eq('user_id',accountId).single();if(r.error)throw r.error;displayName=r.data.display_name;const [ph,ad]=await Promise.all([db.rpc('yuno_my_phone'),db.rpc('yuno_admin_status')]);if(ph.error||ad.error)throw ph.error||ad.error;phone=ph.data||'';isAdmin=ad.data===true;await loadRemote();await loadPeople();await loadMessages();render()}
async function loginAccount(e){e.preventDefault();const f=new FormData(e.target),r=await db.rpc('yuno_login',{p_name:String(f.get('name')).trim(),p_pin:String(f.get('pin'))});if(r.error||!r.data){notice('כניסה נכשלה: '+(r.error?.message||'שם משתמש או קוד שגויים'));return}try{await finishAccount(r.data)}catch(err){notice('טעינת החשבון נכשלה: '+err.message)}}
async function registerAccount(e){e.preventDefault();const f=new FormData(e.target),r=await db.rpc('yuno_register',{p_name:String(f.get('name')).trim(),p_pin:String(f.get('pin')),p_phone:String(f.get('phone')||'')});if(r.error){notice('יצירת החשבון נכשלה: '+r.error.message);return}try{await finishAccount(r.data)}catch(err){notice('טעינת החשבון נכשלה: '+err.message)}}
async function logoutAccount(){const r=await db.rpc('yuno_logout');if(r.error){notice(r.error.message);return}currentUser=null;displayName='';phone='';isAdmin=false;records=[];profiles=[];messages=[];status='ממתין לכניסה';render()}
async function savePhone(e){e.preventDefault();const next=String(new FormData(e.target).get('phone')||'').trim();const r=await db.rpc('yuno_set_phone',{p_phone:next});if(r.error){notice('שמירת הטלפון נכשלה: '+r.error.message);return}phone=next;notice('הטלפון נשמר בחשבון');render()}
async function changePin(e){e.preventDefault();const f=new FormData(e.target),r=await db.rpc('yuno_change_pin',{p_old:String(f.get('old')),p_new:String(f.get('next'))});if(r.error||!r.data){notice('שינוי הקוד נכשל: '+(r.error?.message||'קוד נוכחי שגוי'));return}notice('הקוד עודכן');e.target.reset()}
async function allPages(table,columns,order){let all=[];for(let offset=0;;offset+=500){let q=db.from(table).select(columns).range(offset,offset+499);if(order)q=q.order(order,{ascending:false});const {data,error}=await q;if(error)throw error;all.push(...data);if(data.length<500)break}return all}
async function exportTXT(){try{let data;if(isAdmin){const r=await db.rpc('yuno_export_all');if(r.error)throw r.error;data=r.data}else{const [items,people,ownMessages]=await Promise.all([allPages('yuno_items','*','updated_at'),allPages('yuno_profiles','user_id,display_name,created_at,last_seen_at','created_at'),allPages('yuno_messages','*','created_at')]);data={items,profiles:people,messages:ownMessages,my_phone:phone,account_id:currentUser.id,scope:'נתונים עסקיים משותפים, משתמשים ציבוריים והודעות שלי בלבד'}}const text='YUNO AI | גיבוי נתונים מלא | '+new Date().toISOString()+'\n'+JSON.stringify(data,null,2);const url=URL.createObjectURL(new Blob(['\uFEFF',text],{type:'text/plain;charset=utf-8'}));const a=document.createElement('a');a.href=url;a.download='YUNO-full-export-'+today()+'.txt';document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),60000);notice('קובץ TXT הורד')}catch(err){notice('הייצוא נכשל: '+err.message)}}
async function wipeAll(){if(!isAdmin)return;const phrase=prompt('מחיקה בלתי הפיכה של כל הרשומות, המשתמשים וההודעות. הקלידו מחק הכל כדי לאשר:');if(phrase!=='מחק הכל')return;if(!confirm('אישור אחרון: למחוק לצמיתות את כל נתוני האתר?'))return;const r=await db.rpc('yuno_wipe_all');if(r.error){notice('המחיקה נכשלה: '+r.error.message);return}records=[];profiles=[];messages=[];displayName='';currentUser=null;isAdmin=false;phone='';status='ממתין לכניסה';render();notice('כל נתוני האתר נמחקו. צרו חשבון חדש כדי להמשיך')}
async function loadRemote(silent=false){if(!db||busy)return;const {data,error}=await db.from('yuno_items').select('id,kind,data,updated_at,owner_id').order('updated_at',{ascending:false}).limit(10000);if(error){status='שגיאת סנכרון';lastError=error.message.includes('schema cache')?'הטבלה public.yuno_items אינה קיימת או אינה חשופה. הריצו setup-upgrade.sql ב־SQL Editor, ואז רעננו את הדף. '+error.message:error.message;if(!silent){connected=false;render()}else if($('sync')){$('sync').textContent=status;$('sync').classList.add('bad')}return}records=data||[];connected=true;lastError='';status='מסונכרן';if(!silent||!$('modal')||$('modal').classList.contains('hidden'))render()}
function openForm(kind,id){const obj=id?records.find(x=>x.id===id)?.data||{}:{},fields=FIELDS[kind];$('modal').innerHTML=`<div class="dialog"><div class="tablehead"><h2>${id?'עריכת':'הוספת'} ${esc(KINDS[kind])}</h2><button class="mini" onclick="closeForm()">✕</button></div><form id="entry"><div class="formgrid">${fields.map(([key,label,type,required,opts])=>`<label class="${type==='textarea'?'wide':''}">${esc(label)}${type==='select'?`<select class="field" name="${key}">${opts.map(v=>`<option value="${esc(v)}" ${obj[key]===v?'selected':''}>${esc(v)}</option>`).join('')}</select>`:type==='textarea'?`<textarea name="${key}" rows="3">${esc(obj[key]||'')}</textarea>`:`<input class="field" name="${key}" type="${type}" ${required?'required':''} ${type==='number'?'min="0"':''} value="${esc(obj[key]??(type==='date'?today():''))}">`}</label>`).join('')}</div><div class="actions"><button type="button" class="ghost" onclick="closeForm()">ביטול</button><button class="btn">שמירה</button></div></form></div>`;$('modal').classList.remove('hidden');$('entry').onsubmit=e=>saveItem(e,kind,id)}
function closeForm(){$('modal').classList.add('hidden')}
async function saveItem(e,kind,id){e.preventDefault();if(busy)return;const obj=Object.fromEntries(new FormData(e.target));for(const f of FIELDS[kind])if(f[2]==='number')obj[f[0]]=val(obj[f[0]]);const original=id?records.find(x=>x.id===id):null;if(id&&!original){notice('הרשומה לא נמצאה');return}if(id&&original.owner_id&&original.owner_id!==currentUser?.id){notice('רק יוצר הרשומה יכול לערוך אותה');return}const item={id:id||(globalThis.crypto?.randomUUID?.()||'id-'+Date.now()+'-'+Math.random().toString(36).slice(2)),kind,data:obj,owner_id:original?.owner_id||currentUser.id,updated_at:new Date().toISOString()};busy=true;try{const {error}=await db.from('yuno_items').upsert(item,{onConflict:'id'});if(error)throw error;closeForm();busy=false;await loadRemote();notice('הרשומה נשמרה במסד הנתונים')}catch(err){notice('שמירה נכשלה: '+err.message)}finally{busy=false}}
async function loadMyProfile(){if(!currentUser)return;const {data,error}=await db.from('yuno_profiles').select('display_name').eq('user_id',currentUser.id).maybeSingle();if(error){lastError='יש להריץ setup-upgrade.sql ב־Supabase SQL Editor. '+error.message;connected=false;render();return}displayName=data?.display_name||'';render()}
async function saveName(e){e.preventDefault();if(!currentUser)return;const name=String(new FormData(e.target).get('name')||'').trim().replace(/\s+/g,' ');if(name.length<2||name.length>40){notice('יש לבחור שם באורך 2–40 תווים');return}const {error}=await db.from('yuno_profiles').update({display_name:name,last_seen_at:new Date().toISOString()}).eq('user_id',currentUser.id);if(error){notice('שמירת השם נכשלה: '+error.message);return}displayName=name;await loadPeople();render()}
async function loadPeople(){if(!db)return;const {data,error}=await db.from('yuno_profiles').select('user_id,display_name,last_seen_at').order('last_seen_at',{ascending:false}).limit(200);if(error){if(page==='users')notice('טעינת משתמשים נכשלה: '+error.message);return}profiles=data||[];if(page==='users'&&displayName)render()}
async function loadMessages(){if(!db)return;const {data,error}=await db.from('yuno_messages').select('id,author_id,recipient_id,body,created_at').order('created_at',{ascending:false}).limit(100);if(error){lastError='טעינת הודעות נכשלה: '+error.message;if(page==='messages')notice(lastError);return}const next=(data||[]).reverse(),changed=JSON.stringify(next)!==JSON.stringify(messages);messages=next;if(changed&&page==='messages'&&displayName)render()}
let sendingMessage=false;async function sendMessage(e){e.preventDefault();if(sendingMessage||!currentUser||!displayName||!recipientId||recipientId===currentUser.id||!profiles.some(p=>p.user_id===recipientId)){notice('בחרו נמען תקין');return}const body=String(new FormData(e.target).get('body')||'').trim();if(!body||body.length>1000){notice('הודעה חייבת להכיל 1–1000 תווים');return}sendingMessage=true;try{const {error}=await db.from('yuno_messages').insert({author_id:currentUser.id,recipient_id:recipientId,body});if(error)throw error;await loadMessages()}catch(err){notice('שליחת ההודעה נכשלה: '+err.message)}finally{sendingMessage=false}}
async function deleteMessage(id){const m=messages.find(x=>x.id===id);if(!m||m.author_id!==currentUser?.id){notice('אפשר למחוק רק הודעות ששלחת');return}if(!confirm('למחוק את ההודעה לצמיתות גם אצל הנמען?'))return;const {data,error}=await db.from('yuno_messages').delete().eq('id',id).select('id');if(error||!data?.length){notice('מחיקת ההודעה נכשלה: '+(error?.message||'אין הרשאה'));return}await loadMessages();notice('ההודעה נמחקה')}
async function heartbeat(){if(!db||!currentUser||!displayName)return;await db.from('yuno_profiles').update({last_seen_at:new Date().toISOString()}).eq('user_id',currentUser.id)}
async function deleteItem(id){const row=records.find(x=>x.id===id);if(!row){notice('הרשומה לא נמצאה');return}if(row.owner_id&&row.owner_id!==currentUser?.id){notice('רק יוצר הרשומה יכול למחוק אותה');return}if(!confirm('למחוק את הרשומה מכל המחשבים?')||busy)return;busy=true;try{const {data,error}=await db.from('yuno_items').delete().eq('id',id).select('id');if(error)throw error;if(!data?.length)throw Error('לא נמחקה רשומה. בדקו הרשאות.');busy=false;await loadRemote();notice('הרשומה נמחקה')}catch(err){notice('מחיקה נכשלה: '+err.message)}finally{busy=false}}
function exportCSV(kind){const rows=items(kind);if(!rows.length){notice('אין רשומות לייצוא');return}const f=FIELDS[kind],csv='\uFEFF'+[f.map(x=>x[1]),...rows.map(x=>f.map(y=>x[y[0]]??''))].map(row=>row.map(v=>'"'+String(v).replace(/"/g,'""')+'"').join(',')).join('\r\n');const a=document.createElement('a'),url=URL.createObjectURL(new Blob([csv],{type:'text/csv;charset=utf-8'}));a.href=url;a.download='YUNO-'+kind+'-'+today()+'.csv';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)}
render();void connect();setInterval(()=>{if(connected&&!busy&&displayName)void loadRemote(true)},15000);setInterval(()=>{if(connected&&displayName){void heartbeat();void loadPeople();if(page==='messages')void loadMessages()}},20000);
</script></body></html>
